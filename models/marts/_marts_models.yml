version: 2

models:
  - name: fct_sales
    description: "One row per invoice line: each item on a sale or cancellation invoice. Cancellations have negative quantities. line_amount is quantity multiplied by unit price for that line."
    columns:
      - name: invoice_number
        data_tests:
          - not_null
      - name: stock_code
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_product')
                field: stock_code
      - name: customer_id
        description: "Customer ID. Missing IDs (about 22%) are set to 'unknown'."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_id
      - name: invoice_date
        description: "Date only; to join dim_date table."
        data_tests:
          - not_null
      - name: line_amount
        description: "Derived from multiplication of quantity and unit price for the line."
      - name: is_cancellation
        description: "Derived from invoice numbers that start with C."
  - name: dim_product
    description: "One stock code and description for each unique product (5305 products in total). When a product has several descriptions, the most frequent non-null one is used. Missing descriptions are set to 'Unknown'."
    columns:
      - name: stock_code
        data_tests:
          - not_null
          - unique
  - name: dim_customer
    description: "One row per customer (5943, including unknown). A unique customer id with their first and last purchase date, and net revenue."
    columns:
      - name: customer_id
        data_tests:
          - not_null
          - unique
      - name: first_purchase_date
        description: "When they first made a purchase. Cancellation is excluded and 61 nulls for cancellation-only customers."
      - name: last_purchase_date
        description: "When they last made a purchase. Cancellation is excluded."
      - name: net_revenue
        description: "Sum of line_amount. Includes cancellations (negative), excludes flagged duplicates."